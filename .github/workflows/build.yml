name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*", "[0-9]*"]
  pull_request:
  # Release with one tap: Actions -> Build -> Run workflow -> tick "release".
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub release (tag = build version 1.0.<run>)"
        type: boolean
        default: false
      release_tag:
        description: "Existing release tag to attach the APK to (e.g. 1.0.39)"
        required: false
        default: ""

permissions:
  contents: write

env:
  # Tag of the GitHub release this build belongs to (empty for normal builds); also the versionName.
  RELEASE_TAG: ${{ inputs.release_tag || (inputs.release && format('1.0.{0}', github.run_number)) || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Lint + Debug build
        run: gradle --no-daemon lintDebug assembleDebug

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Release build (signed)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD fehlen"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "SIGNING=release-key" >> "$GITHUB_ENV"
          set +e
          gradle --no-daemon assembleRelease 2>&1 | tee "$RUNNER_TEMP/release.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Logs are not readable via the API; annotations are.
            { grep -E "^e: |^ERROR|error:" "$RUNNER_TEMP/release.log"; \
              sed -n '/What went wrong/,/\* Try/p' "$RUNNER_TEMP/release.log"; } \
              | grep -v "^> Task" | head -30 \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"

      - name: Size report
        if: always()
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          echo "APK_BYTES=$(stat -c %s "$APK")" >> "$GITHUB_ENV"
          AM="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$AM" dex packages --defined-only --proguard-folder app/build/outputs/mapping/release "$APK" > "$RUNNER_TEMP/dex.txt" || true
          {
            echo "## APK sizes (bytes)"
            ls -l app/build/outputs/apk/*/*.apk | awk '{print $5, $9}'
            echo "## Release content (uncompressed compressed name)"
            unzip -lv "$APK" | awk 'NR>3 {print $1, $3, $8}'
            echo "## Dex size by top-level package (bytes)"
            awk -F'\t' '$1 ~ /^P/ {n=split($4,a,"."); if (n<=2) print $3, $4}' "$RUNNER_TEMP/dex.txt" | sort -rn | head -15
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "Release APK 1.0.${{ github.run_number }}: ${{ env.APK_BYTES }} bytes (${{ env.SIGNING }})"
        run: echo "release apk ${{ env.APK_BYTES }} bytes"

      - uses: actions/upload-artifact@v6
        with:
          name: MinCalSync-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Name release APK
        if: env.RELEASE_TAG != ''
        run: cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/MinCalSync-${RELEASE_TAG#v}.apk"

      - name: GitHub Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # New tag (release input) goes on the commit that was built.
          target_commitish: ${{ github.sha }}
          files: ${{ runner.temp }}/MinCalSync-*.apk
